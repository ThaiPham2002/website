<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seafood - Hương Vị Biển Cả</title>
    <link rel="stylesheet" href="style.css"> <!-- nếu bạn dùng file CSS chung -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            background-color: #f9f9f9;
        }
        header {
            background: #ff5a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .big-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }
        h1 {
            color: #333;
            margin-top: 20px;
        }
        .info {
            margin: 15px 0;
        }
        .info strong {
            color: #ff5a5f;
        }
        .review {
            background: #f1f1f1;
            padding: 15px;
            border-left: 5px solid #ff5a5f;
            margin-top: 30px;
            border-radius: 5px;
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #ff5a5f;
        }
    </style>
</head>
<body>

    <header>
        <h2>Seafood - Hương Vị Biển Cả</h2>
    </header>

    <div class="container">
        <img class="big-image" src="images/seafood.jpg" alt="Seafood">

        <h1>Seafood</h1>

        <p>Đây là sưu tập những quán mà tôi đã từng ghé ăn mọi người có thể mở link googlemap phía dưới để xem quán nào gần mình nhé</p>

        <div class="info">
            <p><strong>Giá tham khảo:</strong>Từ 100.000đ - 500.000đ / người</p>
            <p><strong>Bản đồ:</strong>
                <a href="https://maps.app.goo.gl/jd4D6MRCvNjsvWPf8"
                   target="_blank" style="color: #007bff; text-decoration: underline;">
                    📍 Xem trên Google Maps
                </a>
            </p>
        </div>

        <a class="back" href="index.html">← Quay lại trang chính</a>
    </div>

</body>
</html>
